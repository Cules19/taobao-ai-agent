<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="淘宝风格模拟商城的本地 AI 导购演示。">
  <title>选物助手 · AI 导购</title>
  <link rel="stylesheet" href="/assets/styles.css">
  <script src="/assets/chat.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-mark" aria-hidden="true">选</span> 选物助手</div>
    <span class="badge">模拟商城</span>
  </header>
  <main class="layout">
    <aside class="sidebar" aria-label="演示与收藏">
      <p class="eyebrow">本地导购演示</p>
      <h1>你的购物<br>小助手<span>。</span></h1>
      <p class="muted">说说你想买什么，我可以帮你筛商品、比价格、查优惠和演示物流。</p>
      <section class="examples" aria-labelledby="examples-title">
        <h2 id="examples-title">试着问我</h2>
        <button type="button" data-prompt="找 200 元以内的蓝牙耳机，按销量排序">搜 200 元内的耳机</button>
        <button type="button" data-prompt="179 元的耳机有什么券能用？">查耳机优惠券</button>
        <button type="button" data-prompt="查询演示订单 DEMO1001 的物流">查演示订单物流</button>
      </section>
      <section class="favorites" aria-labelledby="favorites-title">
        <h2 id="favorites-title">本会话收藏 <span id="favorite-count">0</span></h2>
        <button type="button" data-prompt="查看我的收藏">查看收藏</button>
      </section>
      <p class="footnote">商品、价格、优惠券和订单均为模拟数据。请勿输入真实订单号或个人信息。</p>
    </aside>
    <section class="chat" aria-labelledby="chat-title">
      <div class="chat-header">
        <div><h2 id="chat-title">导购对话</h2><p>商品搜索 · 优惠查询 · 订单追踪</p></div>
        <button type="button" id="reset">新对话</button>
      </div>
      <div id="messages" role="log" aria-label="对话消息" tabindex="0"></div>
      <form id="composer">
        <p id="status" role="status">准备就绪</p>
        <div class="input-row">
          <label class="sr-only" for="message">输入消息</label>
          <input id="message" maxlength="2000" placeholder="例如：找 200 元以内的蓝牙耳机" autocomplete="off" required>
          <button id="send" type="submit">发送</button>
        </div>
      </form>
    </section>
  </main>
</body>
</html>
