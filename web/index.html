<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="选物，一站式 AI 购物研究工作台。">
  <meta name="theme-color" content="#f7f6f2">
  <title>选物 · AI 购物助手</title>
  <link rel="icon" href="/assets/mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/styles.css">
  <script src="/assets/chat.js" defer></script>
</head>
<body>
  <div class="shell">
    <aside class="rail" aria-label="对话导航">
      <a class="brand" href="/"><img src="/assets/mark.svg" width="39" height="39" alt=""><span>选物<small>SELECT STUDIO</small></span></a>
      <button type="button" id="reset" class="new"><span aria-hidden="true">＋</span> 新建对话</button>
      <details class="history-panel" open>
        <summary>最近对话</summary>
        <nav id="history" aria-label="最近对话"></nav>
      </details>
      <div class="rail-footer"><span class="dot"></span> 私有工作台 <span class="version">v3.0</span></div>
    </aside>
    <main class="workspace">
      <header class="topbar">
        <div><span class="top-label">工作台</span><span class="divider">/</span><h1>导购对话</h1></div>
        <div><button class="mobile-favorites" type="button" data-prompt="查看我的收藏">♡ 收藏 <span id="mobile-count">0</span></button><span class="sandbox"><span class="dot"></span> 模拟商城</span></div>
      </header>
      <div class="viewport" id="viewport">
        <section class="welcome" id="welcome" aria-labelledby="hero-title">
          <div class="hero">
            <div class="hero-copy"><p class="kicker">✦ &nbsp; SHOPPING INTELLIGENCE</p>
            <h2 id="hero-title">好东西，<br>值得<span>好好选。</span></h2>
            <p>从一个想法到一份购物清单。告诉我你的预算和使用场景，我帮你筛选、比较和追踪。</p></div>
            <img class="hero-art" src="/assets/orbit.svg" alt="" width="360" height="300">
          </div>
          <div class="section-title"><h3>从这里开始</h3><span>快速指令</span></div>
          <div class="suggestions">
            <button type="button" data-prompt="找 200 元以内的蓝牙耳机，按销量排序"><span class="tile peach" aria-hidden="true">⌕</span><strong>找商品</strong><small>200 元内的蓝牙耳机</small><span class="arrow" aria-hidden="true">↗</span></button>
            <button type="button" data-prompt="179 元的耳机有什么券能用？"><span class="tile lilac" aria-hidden="true">％</span><strong>查优惠</strong><small>看看耳机有什么券</small><span class="arrow" aria-hidden="true">↗</span></button>
            <button type="button" data-prompt="查询演示订单 DEMO1001 的物流"><span class="tile sage" aria-hidden="true">▤</span><strong>追物流</strong><small>查找演示订单进度</small><span class="arrow" aria-hidden="true">↗</span></button>
          </div>
        </section>
        <div id="messages" role="log" aria-label="对话消息"></div>
      </div>
      <div class="composer-area">
        <form id="composer">
          <button class="inline-kb" type="button" data-prompt="主动降噪和被动隔音有什么区别？">◇ 问选购知识</button>
          <label class="sr-only" for="message">输入消息</label>
          <textarea id="message" rows="2" maxlength="2000" placeholder="例如：帮我比较两款适合通勤的耳机" required></textarea>
          <div class="composer-bottom"><span id="status" role="status">Enter 发送 · Shift + Enter 换行</span><button id="send" type="submit">发送 <span aria-hidden="true">↑</span></button></div>
        </form>
        <p class="disclaimer">商品、价格、优惠和订单均为模拟数据。请勿输入个人信息。</p>
      </div>
    </main>
    <aside class="insights" aria-label="购物清单">
      <div class="insight-heading"><span class="eyebrow">YOUR SHORTLIST</span><h2>购物清单</h2><p>把值得考虑的商品留在当前对话，再慢慢比较。</p></div>
      <section class="insight-card"><div class="insight-row"><span class="tile peach" aria-hidden="true">♡</span><div><strong>已收藏</strong><small>仅当前对话</small></div><span id="favorite-count">0</span></div><button type="button" data-prompt="查看我的收藏">查看收藏 <span aria-hidden="true">→</span></button></section>
      <section class="tip"><span class="eyebrow">选物模拟资料</span><p id="knowledge-status" role="status">正在检查知识库索引…</p><button class="knowledge-shortcut" type="button" data-prompt="主动降噪和被动隔音有什么区别？">问一个选购问题 →</button></section>
    </aside>
  </div>
</body>
</html>
